<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carteira</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carteira">

  <link rel="apple-touch-icon" sizes="180x180" href="icon.png/rg/icon-180.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      margin: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(48px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: #fff;
      z-index: 10;
      flex-shrink: 0;
    }   

    .left {
      position: absolute;
      left: 12px;
      font-size: 18px;
    }

    .center {
      margin: 0 auto;
      font-size: 15px;
      font-weight: 400;
    }

    .right {
      position: absolute;
      right: 12px;
      display: flex;
      gap: 12px;
      font-size: 18px;
    }

    .icon {
      cursor: pointer;
    }

    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #ddd;
      height: 64px;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
      flex-shrink: 0;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 400;
      color: #000;
      border-bottom: 2px solid transparent;
    }

    .tabs button.active {
      border-bottom: 2px solid #02011a;
      font-weight: 400;
      color: #000;
    }

    .content {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f5f5f5;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0; 
    }

    /* REGRA PARA O QR CODE (PADRÃO) */
    .doc {
      touch-action: pan-x;
      user-select: none;
      display: block;
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    /* REGRA PARA FRENTE E VERSO - PREENCHE TUDO SEM CORTAR */
    .doc.rotated {
      /* Usa a altura da tela para definir a largura girada */
      width: 100vh; 
      /* A altura é um pouco menor que a largura da tela para caber as margens do documento */
      height: 90vw; 
      max-width: none;
      max-height: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      object-fit: contain; /* AQUI: contain em vez de cover para não cortar */
    }

    .update {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f2f2f2;
      text-align: center;
      font-size: 14px;
      padding: 12px 0;
      z-index: 10;
      border-top: 1px solid #ddd;
    }

    .bottom {
      height: 12%;
      background: #fff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: content-box;
      z-index: 10;
    }

    .bottom button {
      flex: 1;
      padding: 6px 0 4px;
      border: none;
      background: none;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #666;
    }

    .bottom svg {
      width: 22px;
      height: 22px;
    }

    .bottom button.active {
      color: #25253a;
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="left">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"></path>
      </svg>
    </div>

    <div class="center">Carteira</div>

    <div class="right">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-share" viewBox="0 0 16 16">
          <path d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5m-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"></path>
        </svg>
      </span>
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
          <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"></path>
        </svg>
      </span>
    </div>
  </header>

  <div class="tabs">
    <button class="active" onclick="trocarImagem('frente', this)">Frente</button>
    <button onclick="trocarImagem('verso', this)">Verso</button>
    <button onclick="trocarImagem('qr', this)">QR Code</button>
  </div>

  <main class="content">
    <p class="update" id="lastUpdate"></p>
    <div class="card">
      <img id="imagem" src="icon.png/rg/frente6.png" class="doc rotated">
    </div>
  </main>

  <nav class="bottom">
    <button class="active">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-wallet-fill" viewBox="0 0 16 16">
        <path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v2h6a.5.5 0 0 1 .5.5c0 .253.08.644.306.958.207.288.557.542 1.194.542s.987-.254 1.194-.542C9.42 6.644 9.5 6.253 9.5 6a.5.5 0 0 1 .5-.5h6v-2A1.5 1.5 0 0 0 14.5 2z"></path>
        <path d="M16 6.5h-5.551a2.7 2.7 0 0 1-.443 1.042C9.613 8.088 8.963 8.5 8 8.5s-1.613-.412-2.006-.958A2.7 2.7 0 0 1 5.551 6.5H0v6A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5z"></path>
      </svg>
      <span>Carteira</span>
    </button>
    <button>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-tag-fill" viewBox="0 0 16 16">
        <path d="M2 1a1 1 0 0 0-1 1v4.586a1 1 0 0 0 .293.707l7 7a1 1 0 0 0 1.414 0l4.586-4.586a1 1 0 0 0 0-1.414l-7-7A1 1 0 0 0 6.586 1zm4 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"></path>
      </svg>
      <span>Serviços</span>
    </button>
    <button>
      <svg xmlns="http://www.w3.org/2000/svg" class="menu-svg" viewBox="0 0 16 16" fill="currentColor">
        <path d="M2 4h12v1H2zm0 4h12v1H2zm0 4h12v1H2z"></path>
      </svg>
      <span>Opções</span>
    </button>
  </nav>

  <script>
    const dadosAPI = {
      imagens: {
        frente: "icon.png/rg/frente6.png",
        verso: "icon.png/rg/verso6.png",
        qr: "icon.png/rg/qr2.png" 
      },
      atualizadoEm: new Date().toISOString()
    };

    const ordem = ["frente", "verso", "qr"];
    let indiceAtual = 0;

    const img = document.getElementById("imagem");
    const botoes = document.querySelectorAll(".tabs button");

    function trocarImagemPorIndice(index) {
      indiceAtual = index;
      const tipo = ordem[indiceAtual];
      
      img.src = dadosAPI.imagens[tipo];

      botoes.forEach(b => b.classList.remove("active"));
      botoes[indiceAtual].classList.add("active");

      if (tipo === 'qr') {
        img.classList.remove("rotated"); 
      } else {
        img.classList.add("rotated"); 
      }
    }

    function trocarImagem(tipo, botao) {
      indiceAtual = ordem.indexOf(tipo);
      trocarImagemPorIndice(indiceAtual);
    }

    function atualizarHora(dataISO) {
      const d = new Date(dataISO);
      const f = n => String(n).padStart(2, "0");

      document.getElementById("lastUpdate").textContent =
        `Última atualização em: ${f(d.getDate())}/${f(d.getMonth()+1)}/${f(d.getFullYear())} - ${f(d.getHours())}:${f(d.getMinutes())}`;
    }

    trocarImagemPorIndice(0);
    atualizarHora(dadosAPI.atualizadoEm);

    let startX = 0;

    img.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    });

    img.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
      const diff = endX - startX;

      if (Math.abs(diff) < 50) return;

      if (diff < 0 && indiceAtual < ordem.length - 1) {
        trocarImagemPorIndice(indiceAtual + 1);
      }

      if (diff > 0 && indiceAtual > 0) {
        trocarImagemPorIndice(indiceAtual - 1);
      }
    });

    document.addEventListener(
      "touchmove",
      function(e) {
        if (Math.abs(e.touches[0].clientY) > 0) {
          e.preventDefault();
        }
      },
      { passive: false }
    );
  </script>
</body>
</html>
